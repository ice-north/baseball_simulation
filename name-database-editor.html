<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>選手名データベース エディター</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const NameDatabaseEditor = () => {
      // 苗字データ
      const [surnames, setSurnames] = useState([]);
      const [newSurname, setNewSurname] = useState('');
      const [newSurnameWeight, setNewSurnameWeight] = useState(3);

      // 名前データ
      const [givenNames, setGivenNames] = useState([]);
      const [newGivenName, setNewGivenName] = useState('');
      const [newGivenNameWeight, setNewGivenNameWeight] = useState(1);

      // UI状態
      const [activeTab, setActiveTab] = useState('surnames'); // 'surnames' or 'givenNames'
      const [searchTerm, setSearchTerm] = useState('');
      const [sortBy, setSortBy] = useState('weight'); // 'weight', 'name', 'index'

      // 苗字を追加
      const addSurname = () => {
        if (!newSurname.trim()) {
          alert('苗字を入力してください');
          return;
        }
        if (surnames.some(s => s.name === newSurname.trim())) {
          alert('その苗字は既に登録されています');
          return;
        }
        setSurnames([...surnames, {
          name: newSurname.trim(),
          weight: parseInt(newSurnameWeight) || 1,
          id: Date.now()
        }]);
        setNewSurname('');
        setNewSurnameWeight(3);
      };

      // 苗字を削除
      const deleteSurname = (id) => {
        if (confirm('この苗字を削除しますか？')) {
          setSurnames(surnames.filter(s => s.id !== id));
        }
      };

      // 苗字のウエイトを変更
      const updateSurnameWeight = (id, newWeight) => {
        setSurnames(surnames.map(s =>
          s.id === id ? { ...s, weight: parseInt(newWeight) || 1 } : s
        ));
      };

      // 名前を追加
      const addGivenName = () => {
        if (!newGivenName.trim()) {
          alert('名前を入力してください');
          return;
        }
        if (givenNames.some(g => g.name === newGivenName.trim())) {
          alert('その名前は既に登録されています');
          return;
        }
        setGivenNames([...givenNames, {
          name: newGivenName.trim(),
          weight: parseInt(newGivenNameWeight) || 1,
          id: Date.now()
        }]);
        setNewGivenName('');
        setNewGivenNameWeight(1);
      };

      // 名前を削除
      const deleteGivenName = (id) => {
        if (confirm('この名前を削除しますか？')) {
          setGivenNames(givenNames.filter(g => g.id !== id));
        }
      };

      // 名前のウエイトを変更
      const updateGivenNameWeight = (id, newWeight) => {
        setGivenNames(givenNames.map(g =>
          g.id === id ? { ...g, weight: parseInt(newWeight) || 1 } : g
        ));
      };

      // playerNames.js形式でエクスポート
      const exportToJS = () => {
        const sortedSurnames = [...surnames].sort((a, b) => b.weight - a.weight || a.name.localeCompare(b.name));
        const sortedGivenNames = [...givenNames].sort((a, b) => b.weight - a.weight || a.name.localeCompare(b.name));

        const surnamesData = sortedSurnames.map(s => `    { name: '${s.name}', weight: ${s.weight} }`).join(',\n');
        const givenNamesData = sortedGivenNames.map(g => `    '${g.name}'`).join(', ');

        const content = `// ============================================================
// 選手名データベース - playerNames.js
// 苗字: ${surnames.length}種類、名前: ${givenNames.length}種類
// ============================================================

window.PLAYER_NAMES = {
  // 苗字データ（重み付け）
  surnames: [
${surnamesData}
  ],

  // 名前データ
  givenNames: [
${givenNamesData}
  ]
};

/**
 * 重み付けでランダムな苗字を取得
 * @returns {string} ランダムな苗字
 */
window.getRandomSurname = function() {
  const surnames = window.PLAYER_NAMES.surnames;
  const totalWeight = surnames.reduce((sum, item) => sum + item.weight, 0);
  let random = Math.random() * totalWeight;

  for (const item of surnames) {
    random -= item.weight;
    if (random < 0) {
      return item.name;
    }
  }

  return surnames[0].name;
};

/**
 * 重み付けでランダムな名前を取得
 * @returns {string} ランダムな名前
 */
window.getRandomGivenName = function() {
  const givenNames = window.PLAYER_NAMES.givenNames;
  return givenNames[Math.floor(Math.random() * givenNames.length)];
};

/**
 * フルネームを生成
 * @returns {string} ランダムなフルネーム
 */
window.generateRandomPlayerName = function() {
  return \`\${getRandomSurname()} \${getRandomGivenName()}\`;
};

console.log('✅ 選手名データベース読み込み完了（苗字: ' + window.PLAYER_NAMES.surnames.length + '種類、名前: ' + window.PLAYER_NAMES.givenNames.length + '種類）');
`;

        // ダウンロード
        const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'playerNames.js';
        a.click();
        URL.revokeObjectURL(url);
      };

      // JSONエクスポート（編集用）
      const exportToJSON = () => {
        const data = {
          surnames: surnames,
          givenNames: givenNames
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'name-database.json';
        a.click();
        URL.revokeObjectURL(url);
      };

      // JSONインポート
      const importFromJSON = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.surnames) setSurnames(data.surnames);
            if (data.givenNames) setGivenNames(data.givenNames);
            alert('インポート成功！');
          } catch (error) {
            alert('JSONファイルの読み込みに失敗しました');
          }
        };
        reader.readAsText(file);
      };

      // 既存のplayerNames.jsからインポート
      const importFromExistingFile = () => {
        if (window.PLAYER_NAMES) {
          const importedSurnames = window.PLAYER_NAMES.surnames.map((s, idx) => ({
            name: s.name,
            weight: s.weight,
            id: Date.now() + idx
          }));
          const importedGivenNames = window.PLAYER_NAMES.givenNames.map((name, idx) => ({
            name: name,
            weight: 1,
            id: Date.now() + 10000 + idx
          }));

          setSurnames(importedSurnames);
          setGivenNames(importedGivenNames);
          alert(`インポート成功！苗字${importedSurnames.length}個、名前${importedGivenNames.length}個`);
        } else {
          alert('playerNames.jsが読み込まれていません');
        }
      };

      // ソート処理
      const getSortedItems = (items) => {
        let sorted = [...items];
        if (sortBy === 'weight') {
          sorted.sort((a, b) => b.weight - a.weight || a.name.localeCompare(b.name));
        } else if (sortBy === 'name') {
          sorted.sort((a, b) => a.name.localeCompare(b.name));
        }
        return sorted;
      };

      // フィルター処理
      const getFilteredItems = (items) => {
        if (!searchTerm) return items;
        return items.filter(item => item.name.includes(searchTerm));
      };

      const displaySurnames = getFilteredItems(getSortedItems(surnames));
      const displayGivenNames = getFilteredItems(getSortedItems(givenNames));

      // 統計情報
      const surnameStats = {
        total: surnames.length,
        weight10: surnames.filter(s => s.weight === 10).length,
        weight5: surnames.filter(s => s.weight === 5).length,
        weight3: surnames.filter(s => s.weight === 3).length,
        weight1: surnames.filter(s => s.weight === 1).length,
      };

      const givenNameStats = {
        total: givenNames.length,
      };

      return (
        <div className="min-h-screen p-4">
          <div className="max-w-7xl mx-auto">
            {/* ヘッダー */}
            <div className="mb-6">
              <h1 className="text-3xl font-bold mb-2">⚾ 選手名データベース エディター</h1>
              <p className="text-gray-400">苗字と名前を入力してplayerNames.jsを作成</p>
            </div>

            {/* 統計情報 */}
            <div className="bg-gray-800 rounded-lg p-4 mb-4 grid grid-cols-2 md:grid-cols-5 gap-4">
              <div>
                <div className="text-gray-400 text-sm">苗字</div>
                <div className="text-2xl font-bold text-blue-400">{surnameStats.total}</div>
              </div>
              <div>
                <div className="text-gray-400 text-sm">重み10</div>
                <div className="text-xl font-bold text-pink-400">{surnameStats.weight10}</div>
              </div>
              <div>
                <div className="text-gray-400 text-sm">重み5</div>
                <div className="text-xl font-bold text-red-400">{surnameStats.weight5}</div>
              </div>
              <div>
                <div className="text-gray-400 text-sm">重み3</div>
                <div className="text-xl font-bold text-orange-400">{surnameStats.weight3}</div>
              </div>
              <div>
                <div className="text-gray-400 text-sm">重み1</div>
                <div className="text-xl font-bold text-gray-400">{surnameStats.weight1}</div>
              </div>
              <div className="col-span-2 md:col-span-5 border-t border-gray-700 pt-3 mt-2">
                <div className="text-gray-400 text-sm">名前</div>
                <div className="text-2xl font-bold text-green-400">{givenNameStats.total}</div>
                <div className="text-xs text-gray-500 mt-1">組み合わせ: {surnameStats.total.toLocaleString()} × {givenNameStats.total.toLocaleString()} = {(surnameStats.total * givenNameStats.total).toLocaleString()}通り</div>
              </div>
            </div>

            {/* エクスポート・インポート */}
            <div className="bg-gray-800 rounded-lg p-4 mb-4 flex flex-wrap gap-2">
              <button
                onClick={exportToJS}
                className="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-bold"
              >
                📥 playerNames.jsをダウンロード
              </button>
              <button
                onClick={exportToJSON}
                className="bg-green-600 hover:bg-green-700 px-4 py-2 rounded"
              >
                💾 JSON保存（編集用）
              </button>
              <label className="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded cursor-pointer">
                📂 JSON読み込み
                <input
                  type="file"
                  accept=".json"
                  onChange={importFromJSON}
                  className="hidden"
                />
              </label>
            </div>

            {/* タブ */}
            <div className="flex gap-2 mb-4">
              <button
                onClick={() => setActiveTab('surnames')}
                className={`px-6 py-3 rounded-t font-bold ${
                  activeTab === 'surnames' ? 'bg-blue-600' : 'bg-gray-700 hover:bg-gray-600'
                }`}
              >
                苗字 ({surnames.length})
              </button>
              <button
                onClick={() => setActiveTab('givenNames')}
                className={`px-6 py-3 rounded-t font-bold ${
                  activeTab === 'givenNames' ? 'bg-green-600' : 'bg-gray-700 hover:bg-gray-600'
                }`}
              >
                名前 ({givenNames.length})
              </button>
            </div>

            {/* 苗字タブ */}
            {activeTab === 'surnames' && (
              <div className="bg-gray-800 rounded-lg p-6">
                {/* 追加フォーム */}
                <div className="mb-6 bg-gray-700 p-4 rounded">
                  <h3 className="font-bold mb-3">苗字を追加</h3>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="苗字を入力（例: 佐藤）"
                      value={newSurname}
                      onChange={(e) => setNewSurname(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && addSurname()}
                      className="flex-1 bg-gray-600 border border-gray-500 rounded px-3 py-2"
                    />
                    <select
                      value={newSurnameWeight}
                      onChange={(e) => setNewSurnameWeight(e.target.value)}
                      className="bg-gray-600 border border-gray-500 rounded px-3 py-2"
                    >
                      <option value="10">重み10（超頻出）</option>
                      <option value="5">重み5（頻出）</option>
                      <option value="3">重み3（一般的）</option>
                      <option value="1">重み1（珍しい）</option>
                    </select>
                    <button
                      onClick={addSurname}
                      className="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded font-bold"
                    >
                      追加
                    </button>
                  </div>
                  <div className="text-xs text-gray-400 mt-2">
                    💡 重み10: 佐藤・鈴木など超頻出 / 重み5: 中川・上田など頻出 / 重み3: 一般的 / 重み1: 珍しい苗字
                  </div>
                </div>

                {/* 検索・ソート */}
                <div className="mb-4 flex gap-2">
                  <input
                    type="text"
                    placeholder="🔍 検索..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="flex-1 bg-gray-700 border border-gray-600 rounded px-3 py-2"
                  />
                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="bg-gray-700 border border-gray-600 rounded px-3 py-2"
                  >
                    <option value="weight">重み順</option>
                    <option value="name">名前順</option>
                    <option value="index">追加順</option>
                  </select>
                </div>

                {/* 苗字リスト */}
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {displaySurnames.length === 0 ? (
                    <div className="text-gray-500 text-center py-8">
                      苗字が登録されていません
                    </div>
                  ) : (
                    displaySurnames.map((surname) => (
                      <div key={surname.id} className="bg-gray-700 p-3 rounded flex items-center gap-3">
                        <div className="flex-1 font-bold text-lg">{surname.name}</div>
                        <select
                          value={surname.weight}
                          onChange={(e) => updateSurnameWeight(surname.id, e.target.value)}
                          className="bg-gray-600 border border-gray-500 rounded px-2 py-1 text-sm"
                        >
                          <option value="10">重み10</option>
                          <option value="5">重み5</option>
                          <option value="3">重み3</option>
                          <option value="1">重み1</option>
                        </select>
                        <div className={`px-2 py-1 rounded text-xs font-bold ${
                          surname.weight === 10 ? 'bg-pink-600' :
                          surname.weight === 5 ? 'bg-red-600' :
                          surname.weight === 3 ? 'bg-orange-600' : 'bg-gray-600'
                        }`}>
                          {surname.weight === 10 ? '超頻出' :
                           surname.weight === 5 ? '頻出' :
                           surname.weight === 3 ? '一般的' : '珍しい'}
                        </div>
                        <button
                          onClick={() => deleteSurname(surname.id)}
                          className="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm"
                        >
                          削除
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* 名前タブ */}
            {activeTab === 'givenNames' && (
              <div className="bg-gray-800 rounded-lg p-6">
                {/* 追加フォーム */}
                <div className="mb-6 bg-gray-700 p-4 rounded">
                  <h3 className="font-bold mb-3">名前を追加</h3>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="名前を入力（例: 太郎）"
                      value={newGivenName}
                      onChange={(e) => setNewGivenName(e.target.value)}
                      onKeyPress={(e) => e.key === 'Enter' && addGivenName()}
                      className="flex-1 bg-gray-600 border border-gray-500 rounded px-3 py-2"
                    />
                    <button
                      onClick={addGivenName}
                      className="bg-green-600 hover:bg-green-700 px-6 py-2 rounded font-bold"
                    >
                      追加
                    </button>
                  </div>
                </div>

                {/* 検索 */}
                <div className="mb-4">
                  <input
                    type="text"
                    placeholder="🔍 検索..."
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2"
                  />
                </div>

                {/* 名前リスト */}
                <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2 max-h-96 overflow-y-auto">
                  {displayGivenNames.length === 0 ? (
                    <div className="col-span-full text-gray-500 text-center py-8">
                      名前が登録されていません
                    </div>
                  ) : (
                    displayGivenNames.map((name) => (
                      <div key={name.id} className="bg-gray-700 p-2 rounded flex items-center justify-between">
                        <div className="font-bold">{name.name}</div>
                        <button
                          onClick={() => deleteGivenName(name.id)}
                          className="bg-red-600 hover:bg-red-700 px-2 py-1 rounded text-xs"
                        >
                          ×
                        </button>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* フッター */}
            <div className="mt-6 text-center text-gray-500 text-sm">
              <p>データを入力したら「playerNames.jsをダウンロード」でファイルを保存してください</p>
              <p className="mt-1">保存したファイルを js/data/playerNames.js に配置します</p>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.render(<NameDatabaseEditor />, document.getElementById('root'));
  </script>

  <!-- 既存のplayerNames.jsを読み込む（オプション） -->
  <script src="js/data/playerNames.js"></script>
</body>
</html>
