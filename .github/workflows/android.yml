name: android

# スマホアプリ（mobile/）の検査と APK のビルド。mobile/ を触ったときだけ動く。
# できた APK は実行結果の「Artifacts」から落として端末に入れる。
# ⚠ アプリの共通部は Web 版の表と計算を写している（mobile/tools/）。写し元を直したときも動かす
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
      - 'src/season/campTraining.js'
      - 'src/season/trainingPolicy.js'
      - 'src/online/shared.js'
      - 'src/online/tactics.js'
      - 'src/online/pitchingEdit.js'
      - 'src/online/tryoutPlan.js'
      - 'src/online/statsView.js'
      - 'src/utils/constants.js'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
      - 'src/season/campTraining.js'
      - 'src/season/trainingPolicy.js'
      - 'src/online/shared.js'
      - 'src/online/tactics.js'
      - 'src/online/pitchingEdit.js'
      - 'src/online/tryoutPlan.js'
      - 'src/online/statsView.js'
      - 'src/utils/constants.js'
  workflow_dispatch:

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠ 履歴を全部取る。アプリに「最後に mobile/ を変えたコミット」を入れ、ホームの紙面で最新かを確かめるため
          #    （androidApp/build.gradle.kts の APP_COMMIT・shared の AppUpdate.kt）。浅いと HEAD のコミットになる
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web 版の表・計算と揃っているか
        run: |
          node tools/gen-tables.mjs --check
          node tools/expect-logic.mjs --check
      - name: 共通部分の検査
        run: ./gradlew :shared:jvmTest --console=plain
      - name: アプリの通信・画面の回帰検査
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain
      - name: APK をビルド
        run: ./gradlew :androidApp:assembleDebug --console=plain
      - name: アプリの版が入ったか
        run: |
          want=$(git log -1 --format=%H -- .)
          [ ${#want} = 40 ] || { echo "mobile/ の最後のコミットが分からない"; exit 1; }
          file=$(find androidApp/build/generated -name BuildConfig.java | head -1)
          grep -q "APP_COMMIT = \"$want\"" "$file" || { echo "APP_COMMIT が $want になっていない"; grep APP_ "$file"; exit 1; }
          grep APP_ "$file"
      - uses: actions/upload-artifact@v4
        with:
          name: baseball-online-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
