name: check

# ビルドとシミュレーション検証ハーネスを回して、桁レベルの崩壊
# （疲労スパイラル・クラブ過剰指名・未import参照など）を自動で踏み抜く。
#
# 重い検査を別々のジョブに分けて同時に走らせる。待ち時間は「合計」ではなく
# 「いちばん長いジョブ」になり、どれが落ちたかも一覧で分かる。
on:
  push:
    branches: [main, master]
  pull_request:

# 同じPR（同じブランチ）に新しく push したら、古い実行は止める。
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ビルド＋ npm run check（lint・一人用・オンラインの検査を並列で。約2分）
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Simulation checks
        run: npm run check

  # progression-check（多年次の人口保存・年齢ピラミッド・ポジション均衡）
  progression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Progression check
        run: npm run check:progression

  # オンラインの通年検査（1年目の開幕から2年目まで実際の日次で進める。約10分）
  online-season:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Online actual daily season (year 1 to year 2)
        run: npm run check:online:season

  # 画面検査（オンラインの PC・スマホと、一人用の通し）
  ui:
    # Playwright 1.58.x が対応するOSへ固定し、latestの更新による導入失敗を防ぐ。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ブラウザ本体は Playwright の版ごとにキャッシュする。OS の依存は毎回入れる。
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Single-player UI
        run: npm run check:ui

      # ⚠ サーバーを立てずに dist を開く（check:ui が作る）。下の PC/スマホの通し検査より
      #    先に置く（あちらが途中で止まっても、この検査の結果は出る）
      - name: Online PC lineup board UI
        run: npm run check:online:lineup-ui

      - name: Online mobile lineup UI
        run: npm run check:online:mobile-lineup-ui

      - name: Online PC and mobile UI
        run: |
          ONLINE_DISABLE_TIMER=1 ONLINE_DATA_FILE="$RUNNER_TEMP/online-ui.json.gz" npm run dev:online > "$RUNNER_TEMP/online-api.log" 2>&1 &
          npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/online-vite.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://127.0.0.1:3000/api/online?action=config'; then break; fi
            sleep 1
          done
          ONLINE_TEST_URL=http://127.0.0.1:3000 npm run check:online:ui
          npm run check:online:auth-ui
          npm run check:online:edit-ui
          npm run check:online:label-ui
          npm run check:online:replay-ui
          npm run check:online:mobile-gameplay-ui

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: |
            /tmp/baseball-online-*.png
            /tmp/baseball-online-*-failure.zip
            /tmp/baseball-single-*.png
            /tmp/baseball-single-*-failure.zip
            ${{ runner.temp }}/online-*.log
          if-no-files-found: ignore
