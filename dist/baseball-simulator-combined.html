  <script>
// ============================================================
// 試合ロジック - simulation-logic.js
// 野球シミュレーションの物理計算と判定ロジック
// ============================================================

/**
 * 物理衝突モデルによるコンタクト計算
 * @param {Object} pitcher - 投手データ（velocity必須）
 * @param {Object} batter - 打者データ（power, meet必須）
 * @param {boolean} isGuessRight - 球種予測が的中したか
 * @param {Object} pitch - 投球データ（type, level, velocity）
 * @param {number} tunnelingEffect - トンネリング効果（0-0.2程度）
 * @param {Object} handEffect - 左右相性効果
 */
const calculatePhysicsContact = (pitcher, batter, isGuessRight, pitch, tunnelingEffect = 0, handEffect = {}) => {
  // 【1】スイングスピードの算出 (Powerを物理量へ)
  // Power 0 → 100km/h, Power 100 → 140km/h
  let v_swing = 100 + (batter.power * 0.4);

  // 左右相性でスイングスピード微調整
  if (handEffect.powerBonus) {
    v_swing += handEffect.powerBonus * 0.3;
  }

  // 【2】タイミング・ウィンドウ (ms)
  const pitchVelocity = pitch.velocity || pitcher.velocity;

  // ★修正: 係数は投手の「素の球速」で決定（変化球の減速を無視）
  const basePitcherVelocity = pitcher.velocity;
  let windowCoef;
  if (basePitcherVelocity >= 155) {
    windowCoef = 0.20;
  } else if (basePitcherVelocity >= 150) {
    windowCoef = 0.26;
  } else if (basePitcherVelocity >= 145) {
    windowCoef = 0.32;
  } else {
    windowCoef = 0.38;
  }

  // 窓の計算は実際の球速で（速い変化球は打ちにくい）
  let timingWindow = (1000 / (pitchVelocity / 3.6)) * windowCoef;

  // ミート窓ボーナス（ミート力が高いと窓が広がる）
  const meetBonus = (batter.meet / 100) * 0.15;  // 最大+15%
  timingWindow *= (1 + meetBonus);

  // 読みが当たれば窓が広がる（準備ができている）
  if (isGuessRight) {
    timingWindow *= 1.3;  // ×1.3
  }

  // トンネリング効果で窓が狭まる（錯覚で準備が遅れる）
  timingWindow *= (1 - tunnelingEffect * 0.3);  // 30%

  // 変化球はさらに窓を狭める（軌道予測が難しい）
  if (pitch.type !== 'straight' && pitch.level) {
    const breakingBallPenalty = (pitch.level / 100) * 0.10;  // 10%
    timingWindow *= (1 - breakingBallPenalty);
  }

  // 【3】スイングの誤差発生 (ミリ秒単位)
  // 打者のmeet値が高いほど、誤差のバラツキが抑えられる
  // Meet 0 → ±10ms, Meet 100 → ±5ms
  const maxError = 10 - (batter.meet * 0.05);  // ±10～5ms

  // 左右相性でミート精度調整
  const meetAdjust = (handEffect.meetBonus || handEffect.meetPenalty || 0) * 0.02;
  const adjustedMaxError = Math.max(1.5, maxError - meetAdjust);  // 最小1.5ms

  const timingError = (Math.random() - 0.5) * 2 * adjustedMaxError;

  // 【4】芯へのミート率 (0.0 ～ 1.0)
  // タイミング誤差がウィンドウ内なら高品質コンタクト
  let meetQuality = Math.max(0, 1 - Math.abs(timingError) / timingWindow);

  // 【5】空振り判定
  // meetQuality が 0.02 以下の時のみ空振り
  const isContact = meetQuality > 0.02;  // 空振り閾値

  // 【6】打球初速の計算 (物理衝突モデル - 修正版)
  // MLB平均Exit Velocity: 約140km/h (88mph)
  // 最大Exit Velocity: 約190km/h (120mph) - 極めて稀
  // ミート品質と打者パワーで決定
  let exitVelocity = 0;
  if (isContact) {
    // 基本初速: 80-100km/h（芯を外した弱い打球）
    const baseVelocity = 80 + (batter.power * 0.2);  // 80-100km/h

    // ミート品質ボーナス: 最大+50km/h（芯を捉えた時）
    const qualityBonus = meetQuality * 50;

    // 投球速度の反発ボーナス: 最大+15km/h
    const pitchBonus = (pitchVelocity - 130) * 0.25;

    exitVelocity = baseVelocity + qualityBonus + pitchBonus;

    // ランダム要素（±5km/h）
    exitVelocity += (Math.random() * 10 - 5);

    // 現実的な範囲に制限: 70-175km/h
    exitVelocity = Math.max(70, Math.min(175, exitVelocity));
  }

  return {
    isContact,
    exitVelocity: Math.round(exitVelocity),
    meetQuality,
    timingError: Math.round(timingError * 10) / 10,
    timingWindow: Math.round(timingWindow * 10) / 10,
    v_swing: Math.round(v_swing)
  };
};

/**
 * トンネリング（軌道錯覚）効果の計算
 * 前球との軌道・速度の連動性が打者のタイミングに影響
 */
const getTunnelingEffect = (lastPitch, currentPitch, catcherLead) => {
  if (!lastPitch) return 0;

  // 球速差による錯覚効果
  const veloDiff = Math.abs(lastPitch.velocity - currentPitch.velocity);

  // 球種の軌道近似性（ストレートから変化球への切り替えが効果的）
  const orbitCloseness = (lastPitch.type === 'straight' && currentPitch.type !== 'straight') ? 0.8 :
                        (lastPitch.type !== 'straight' && currentPitch.type === 'straight') ? 0.6 : 0.2;

  // 捕手のリードが高いほど効果増大
  const leadMultiplier = 1 + (catcherLead / 100);

  return Math.min(0.25, (veloDiff * 0.003 + orbitCloseness * 0.025) * leadMultiplier);
};

/**
 * 打出し角度の計算（コンタクト品質から）
 */
const calculateLaunchAngle = (meetQuality, batter) => {
  let baseLaunchAngle;

  if (meetQuality > 0.8) {
    // 完璧なコンタクト: バレルゾーン（25-35度）
    baseLaunchAngle = 25 + Math.random() * 10;
  } else if (meetQuality > 0.6) {
    // 高品質: ライナー〜適正フライ（10-40度）
    baseLaunchAngle = 10 + Math.random() * 30;
  } else if (meetQuality > 0.4) {
    // 中品質: 幅広い分布（-5〜50度）
    baseLaunchAngle = -5 + Math.random() * 55;
  } else {
    // 低品質: ポップフライかボテボテ
    if (Math.random() < 0.5) {
      baseLaunchAngle = -15 + Math.random() * 20;  // ボテボテゴロ
    } else {
      baseLaunchAngle = 55 + Math.random() * 30;  // ポップフライ
    }
  }

  // パワー打者は角度がつきやすい傾向
  const powerAngleBonus = (batter.power - 60) / 100 * 5;

  return Math.round(baseLaunchAngle + powerAngleBonus);
};

/**
 * 物理エンジン：打球パラメータの計算
 */
const calculateBattedBallPhysics = (batter, pitcher, pitch, physicsResult) => {
  const { exitVelocity, meetQuality } = physicsResult;

  // 打出し角度
  const launchAngle = calculateLaunchAngle(meetQuality, batter);

  // 物理シミュレーション（飛距離・滞空時間）
  const rad = launchAngle * Math.PI / 180;
  const v = exitVelocity / 3.6;  // km/h to m/s
  const g = 9.8;

  // 滞空時間（秒）
  const hangTime = Math.max(0.5, (2 * v * Math.sin(Math.max(0, rad))) / g);

  // 飛距離（メートル）
  let distance;
  if (launchAngle <= 0) {
    // ゴロ: 内野を転がる距離
    distance = 15 + exitVelocity * 0.15 + Math.random() * 20;
  } else {
    // フライ/ライナー
    const optimalAngleFactor = 1 - Math.abs(launchAngle - 30) / 60;
    distance = v * Math.cos(rad) * hangTime * (0.8 + optimalAngleFactor * 0.4);
    distance *= (0.9 + batter.power / 500);
  }

  // 打球方向（-45〜45度）
  const direction = (Math.random() * 90) - 45;

  return {
    exitVelocity,
    launchAngle,
    distance: Math.round(distance),
    hangTime,
    direction,
    meetQuality: Math.round(meetQuality * 100)
  };
};

/**
 * 守備の「時間競合」モデル
 * 野手が打球地点に物理的に到達できるかで判定
 * アウト率は旧モデル基準に調整
 */
const judgeFielderReach = (battedBall, defense, batter) => {
  // 防御的チェック: defenseがnullまたはundefinedの場合はデフォルト値を使用
  const safeDefense = defense || {};
  const { exitVelocity, launchAngle, distance, hangTime, direction } = battedBall || {};

  // 本塁打判定（バレルゾーン）
  // MLB基準: 打球速度158km/h以上、角度26-30度で.500以上の打率
  if (distance > 100 && launchAngle >= 20 && launchAngle <= 40 && exitVelocity >= 150) {
    return { result: 'homerun', bases: 4, description: 'ホームラン！' };
  }

  // 長打圏フライ（95m以上の深いフライ）
  if (distance > 95 && launchAngle >= 25 && launchAngle <= 45 && exitVelocity >= 140) {
    if (Math.random() < 0.7) {
      return { result: 'homerun', bases: 4, description: 'ホームラン！（フェンス越え）' };
    }
  }

  // ポップフライ（60度以上）- 旧モデル: 95-97%アウト
  if (launchAngle >= 60) {
    const catchProb = 0.95 + (safeDefense.catcher?.defense || 70) / 2000;
    if (Math.random() < catchProb) {
      return { result: 'out', bases: 0, description: 'フライアウト（ポップフライ）', isOutfieldFly: false };
    }
    return { result: 'single', bases: 1, description: 'ポテンヒット' };
  }

  // 担当野手の決定
  let fielder, position, isOutfield;

  if (distance < 40) {
    // 内野
    isOutfield = false;
    if (distance < 15) {
      position = 'pitcher';
    } else if (direction < -15) {
      position = 'third';
    } else if (direction < 0) {
      position = 'short';
    } else if (direction < 15) {
      position = 'second';
    } else {
      position = 'first';
    }
    fielder = safeDefense[position] || { defense: 70, speed: 60, arm: 65 };
  } else {
    // 外野
    isOutfield = true;
    if (direction < -10) {
      position = 'left';
    } else if (direction <= 10) {
      position = 'center';
    } else {
      position = 'right';
    }
    fielder = safeDefense[position] || { defense: 70, speed: 65, arm: 70 };
  }

  // ===== ゴロの場合（旧モデル: 内野ゴロ98.5%アウト）=====
  if (launchAngle < 10) {
    if (distance < 40) {
      // 内野ゴロ - 旧モデル基準: 98.5%
      const baseOutRate = 0.985;
      const defenseBonus = (fielder.defense - 70) / 100 * 0.01;  // 守備力で±1%
      const speedPenalty = (batter.speed - 60) / 100 * 0.04;  // 俊足で最大-4%
      const catchProb = Math.min(0.995, Math.max(0.93, baseOutRate + defenseBonus - speedPenalty));

      if (Math.random() < catchProb) {
        // エラー判定
        const errorRate = 0.003 + (100 - fielder.defense) / 2000;
        if (Math.random() < errorRate) {
          return { result: 'single', bases: 1, description: 'エラー（ヒット扱い）', isError: true };
        }
        return { result: 'out', bases: 0, description: `${position === 'pitcher' ? '投' : position === 'first' ? '一' : position === 'second' ? '二' : position === 'short' ? '遊' : '三'}ゴロ`, isOutfieldFly: false };
      }
      return { result: 'single', bases: 1, description: '内野安打' };
    } else {
      // 外野への速いゴロ - 旧モデル: 30%アウト
      const catchProb = 0.30 + (fielder.speed / 100) * 0.10;
      if (Math.random() < catchProb) {
        return { result: 'out', bases: 0, description: '外野ゴロアウト', isOutfieldFly: false };
      }
      return { result: 'single', bases: 1, description: '外野への安打' };
    }
  }

  // ===== ライナーの場合 =====
  if (launchAngle < 25) {
    if (distance < 40) {
      // 内野ライナー - 旧モデル: 90%アウト
      const baseOutRate = 0.90;
      const defenseBonus = (fielder.defense - 70) / 100 * 0.05;
      const catchProb = Math.min(0.95, baseOutRate + defenseBonus);

      if (Math.random() < catchProb) {
        return { result: 'out', bases: 0, description: 'ライナーアウト', isOutfieldFly: false };
      }
      return { result: 'single', bases: 1, description: 'ヒット！' };
    } else {
      // 外野ライナー - 旧モデル: 82%アウト
      const baseOutRate = 0.82;
      const defenseBonus = (fielder.defense - 70) / 100 * 0.08;
      const speedBonus = (fielder.speed - 65) / 100 * 0.05;
      const catchProb = Math.min(0.92, baseOutRate + defenseBonus + speedBonus);

      if (Math.random() < catchProb) {
        return { result: 'out', bases: 0, description: 'ライナーアウト', isOutfieldFly: true, tagupThrowbackChance: (fielder.arm / 100) * 0.5 };
      }
      // 長打判定
      if (distance > 70 && exitVelocity >= 140) {
        return { result: 'double', bases: 2, description: '二塁打！' };
      }
      return { result: 'single', bases: 1, description: 'ヒット！' };
    }
  }

  // ===== フライの場合 =====
  if (distance < 40) {
    // 内野フライ - 旧モデル: 97%アウト
    const catchProb = 0.97 + (fielder.defense / 100) * 0.02;
    if (Math.random() < catchProb) {
      return { result: 'out', bases: 0, description: 'フライアウト', isOutfieldFly: false };
    }
    return { result: 'single', bases: 1, description: 'ポテンヒット' };
  }

  // 外野フライ
  let baseOutRate;
  if (distance < 70) {
    // 浅いフライ - 旧モデル: 99.5%アウト
    baseOutRate = 0.995;
  } else if (distance < 90) {
    // 中堅フライ - 旧モデル: 95%アウト
    baseOutRate = 0.95;
  } else {
    // 深いフライ - 旧モデル: 80%アウト
    baseOutRate = 0.80;
  }

  const defenseBonus = (fielder.defense - 70) / 100 * 0.03;
  const speedBonus = (fielder.speed - 65) / 100 * 0.05;
  const catchProb = Math.min(0.995, baseOutRate + defenseBonus + speedBonus);

  if (Math.random() < catchProb) {
    const isDeepFly = distance > 70;
    return {
      result: 'out',
      bases: 0,
      description: 'フライアウト',
      isOutfieldFly: isDeepFly,
      tagupThrowbackChance: isDeepFly ? (fielder.arm / 100) * 0.6 : 0
    };
  }

  // 安打判定
  if (distance > 80 && launchAngle >= 15 && launchAngle <= 35) {
    if (exitVelocity >= 145 && distance > 90) {
      return { result: 'triple', bases: 3, description: '三塁打！' };
    }
    return { result: 'double', bases: 2, description: '二塁打！' };
  }

  return { result: 'single', bases: 1, description: 'ヒット！' };
};

/**
 * 守備適性計算関数
 * 選手の能力に基づいて各守備位置への適性を計算
 */
const calculateDefensiveFitness = (player, position) => {
  const defense = player.fielding?.defense || 50;
  const speed = player.physical?.speed || 50;
  const arm = player.fielding?.arm || 50;

  let fitness = 0;
  let comments = [];

  switch (position) {
    case 'pitcher':
      // 投手は守備力と制球力が重要
      fitness = defense;
      if (defense < 30) comments.push('守備力不足');
      break;

    case 'catcher':
      // 捕手は守備力とリード、肩が重要
      fitness = (defense * 0.5 + arm * 0.5);
      if (defense < 40) comments.push('守備力不足');
      if (arm < 40) comments.push('肩が弱い');
      break;

    case 'first':
      // 一塁は守備力が重要、足はあまり必要ない
      fitness = defense;
      if (defense < 30) comments.push('守備力不足');
      if (speed > 70) comments.push('足が活かせない');
      break;

    case 'second':
    case 'short':
      // 二遊間は守備力、足、肩すべて重要
      fitness = (defense * 0.4 + speed * 0.3 + arm * 0.3);
      if (defense < 40) comments.push('守備力不足');
      if (speed < 40) comments.push('足が遅い');
      if (arm < 40) comments.push('肩が弱い');
      break;

    case 'third':
      // 三塁は守備力と肩が重要
      fitness = (defense * 0.5 + arm * 0.5);
      if (defense < 40) comments.push('守備力不足');
      if (arm < 40) comments.push('肩が弱い');
      break;

    case 'left':
    case 'right':
      // 両翼は足と肩が重要
      fitness = (defense * 0.3 + speed * 0.4 + arm * 0.3);
      if (speed < 40) comments.push('足が遅い');
      if (arm < 40) comments.push('肩が弱い');
      break;

    case 'center':
      // センターは特に足が重要
      fitness = (defense * 0.3 + speed * 0.5 + arm * 0.2);
      if (speed < 50) comments.push('⚠️足が遅い');
      if (speed < 30) comments.push('🔴センター不適');
      if (arm < 30) comments.push('肩が弱い');
      break;

    default:
      fitness = 50;
  }

  // 適性評価
  let grade = 'C';
  if (fitness >= 80) grade = 'S';
  else if (fitness >= 70) grade = 'A';
  else if (fitness >= 60) grade = 'B';
  else if (fitness >= 40) grade = 'C';
  else grade = 'D';

  return {
    fitness: Math.round(fitness),
    grade,
    comments: comments.length > 0 ? comments.join(', ') : '適性良好'
  };
};

      // 直近の投球履歴（球速）
      const [recentVelocities, setRecentVelocities] = useState([]);
      
      // 打者・投手の成績
      const [batterStats, setBatterStats] = useState({
        plateAppearances: 0, // 打席数
        atBats: 0,
        hits: 0,
        homeruns: 0,
        walks: 0,
        strikeouts: 0,
        totalBases: 0,
        stolenBases: 0,       // 盗塁成功数
        caughtStealing: 0     // 盗塁失敗数
      });
      
      const [pitcherStats, setPitcherStats] = useState({
        pitches: 0,
        outs: 0,
        strikeouts: 0,
        walks: 0,
        runsAllowed: 0,
        errors: 0,  // エラー数
        wildPitches: 0,  // 暴投数を追加
        doublePlay: 0  // 併殺打
      });
      
      // 捕手統計を追加
      const [catcherStats, setCatcherStats] = useState({
        stolenBasesAllowed: 0,  // 盗塁許可数
        caughtStealing: 0,      // 盗塁刺
        wildPitchesBlocked: 0   // 暴投阻止数
      });
      
      // 打球統計
      const [battedBallStats, setBattedBallStats] = useState({
        innerGrounder: { total: 0, hits: 0 }, // 内野ゴロ
        innerLiner: { total: 0, hits: 0 },    // 内野ライナー
        innerFly: { total: 0, hits: 0 },      // 内野フライ
        shallowOuter: { total: 0, hits: 0 },  // 浅い外野
        outerLiner: { total: 0, hits: 0 },    // 外野ライナー
        shallowFly: { total: 0, hits: 0 },    // 浅いフライ
        mediumFly: { total: 0, hits: 0 },     // 中堅フライ
        deepFly: { total: 0, hits: 0 },       // 深いフライ
        outerGrounder: { total: 0, hits: 0 }, // 外野ゴロ
        homerun: { total: 0, hits: 0 }        // 本塁打
      });
      
      // 打球タイプ別統計
      const [battedBallTypeStats, setBattedBallTypeStats] = useState({
        grounder: 0,  // ゴロ
        liner: 0,     // ライナー
        fly: 0,       // フライ
        popup: 0      // ポップフライ
      });
      
      // 打球方向別統計（5方向）
      const [battedBallDirectionStats, setBattedBallDirectionStats] = useState({
        left: 0,        // 左
        leftCenter: 0,  // 左中間
        center: 0,      // 中央
        rightCenter: 0, // 右中間
        right: 0        // 右
      });
      
      // 打球エリア別統計（方向×タイプ）- 詳細版（5方向×5タイプ）
      const [battedBallAreaStats, setBattedBallAreaStats] = useState({
        'left-homerun': { total: 0, outs: 0, hits: 0 },
        'left-fly': { total: 0, outs: 0, hits: 0 },
        'left-liner': { total: 0, outs: 0, hits: 0 },
        'left-popup': { total: 0, outs: 0, hits: 0 },
        'left-grounder': { total: 0, outs: 0, hits: 0 },
        'leftCenter-homerun': { total: 0, outs: 0, hits: 0 },
        'leftCenter-fly': { total: 0, outs: 0, hits: 0 },
        'leftCenter-liner': { total: 0, outs: 0, hits: 0 },
        'leftCenter-popup': { total: 0, outs: 0, hits: 0 },
        'leftCenter-grounder': { total: 0, outs: 0, hits: 0 },
        'center-homerun': { total: 0, outs: 0, hits: 0 },
        'center-fly': { total: 0, outs: 0, hits: 0 },
        'center-liner': { total: 0, outs: 0, hits: 0 },
        'center-popup': { total: 0, outs: 0, hits: 0 },
        'center-grounder': { total: 0, outs: 0, hits: 0 },
        'rightCenter-homerun': { total: 0, outs: 0, hits: 0 },
        'rightCenter-fly': { total: 0, outs: 0, hits: 0 },
        'rightCenter-liner': { total: 0, outs: 0, hits: 0 },
        'rightCenter-popup': { total: 0, outs: 0, hits: 0 },
        'rightCenter-grounder': { total: 0, outs: 0, hits: 0 },
        'right-homerun': { total: 0, outs: 0, hits: 0 },
        'right-fly': { total: 0, outs: 0, hits: 0 },
        'right-liner': { total: 0, outs: 0, hits: 0 },
        'right-popup': { total: 0, outs: 0, hits: 0 },
        'right-grounder': { total: 0, outs: 0, hits: 0 }
      });

      const addPitch = () => {
        const newId = pitcher.pitches.length > 0 
          ? Math.max(...pitcher.pitches.map(b => b.id)) + 1 
          : 1;
        setPitcher({
          ...pitcher,
          pitches: [...pitcher.pitches, { id: newId, type: 'slider', level: 50 }]
        });
      };

      const removePitch = (id) => {
        // ストレート（id=1）は削除不可
        if (id === 1) return;
        setPitcher({
          ...pitcher,
          pitches: pitcher.pitches.filter(b => b.id !== id)
        });
      };

      const updatePitch = (id, field, value) => {
        setPitcher({
          ...pitcher,
          pitches: pitcher.pitches.map(b => 
            b.id === id ? { ...b, [field]: value } : b
          )
        });
      };

      const updateBallEffect = (type, field, value) => {
        setBallEffects({
          ...ballEffects,
          [type]: { ...ballEffects[type], [field]: parseFloat(value) }
        });
      };

      const getCountAdjustment = (balls, strikes) => {
        if (balls === 3 && strikes <= 1) {
          return { strikeZone: 0.7, swingRate: 0.6 };
        }
        if (strikes === 2) {
          return { strikeZone: 1.2, swingRate: 1.3 };
        }
        return { strikeZone: 1.0, swingRate: 1.0 };
      };

      // スタミナによる能力補正を計算
      const getStaminaPenalty = (currentStamina, maxStamina) => {
        const staminaRate = currentStamina / maxStamina;
        
        let velocityPenalty = 0;
        let controlPenalty = 0;
        
        if (staminaRate < 0.50) {  // 50%未満
          if (staminaRate >= 0.40) {  // 49-40%
            velocityPenalty = -5;
            controlPenalty = -5;
          } else if (staminaRate >= 0.30) {  // 39-30%
            velocityPenalty = -10;
            controlPenalty = -10;
          } else if (staminaRate >= 0.20) {  // 29-20%
            velocityPenalty = -15;
            controlPenalty = -15;
          } else if (staminaRate >= 0.10) {  // 19-10%
            velocityPenalty = -20;
            controlPenalty = -20;
          } else {  // 9-0%
            velocityPenalty = -25;
            controlPenalty = -25;
          }
        }
        
        return { velocityPenalty, controlPenalty };
      };

      // 内野手の実効肩力を取得（左投げペナルティ込み）
      const getInfielderEffectiveArm = (position) => {
        const player = defense[position];
        let arm = player.arm;
        
        // セカンド・ショート・サードは左投げで-20
        if ((position === 'second' || position === 'short' || position === 'third') 
            && player.throws === 'left') {
          arm = Math.max(0, arm - 20);
        }
        
        return arm;
      };

      // 左右の相性効果を計算
      const getHandednessEffect = (pitcherThrows, batterBats) => {
        // スイッチヒッターの処理
        let effectiveBats = batterBats;
        if (batterBats === 'switch') {
          effectiveBats = pitcherThrows === 'right' ? 'left' : 'right';
        }
        
        // 相性判定
        const isOppositeHand = (pitcherThrows === 'right' && effectiveBats === 'left') ||
                               (pitcherThrows === 'left' && effectiveBats === 'right');
        
        // 打席別固有補正
        const isPowerHitter = effectiveBats === 'right';  // 右打者はパワー+2
        const isContactHitter = effectiveBats === 'left';  // 左打者は内野安打+
        
        if (isOppositeHand) {
          // 有利な組み合わせ（打者有利）
          return {
            meetBonus: 5,
            powerBonus: isPowerHitter ? 2 : 0,  // 右打者のみ+2
            contactBonus: 0.03,
            infieldHitBonus: isContactHitter ? 0.05 : 0,  // 左打者のみ+5%
            label: '打者有利',
            effectiveBats: effectiveBats
          };
        } else {
          // 不利な組み合わせ（投手有利）
          return {
            meetPenalty: -5,
            powerBonus: isPowerHitter ? 2 : 0,  // 右打者のみ+2
            contactBonus: -0.03,
            infieldHitBonus: isContactHitter ? 0.05 : 0,  // 左打者のみ+5%
            label: '投手有利',
            effectiveBats: effectiveBats
          };
        }
      };

      /**
       * 物理演算ベースのコンタクト結果判定（新エンジン）
       */
      const determineContactResultPhysics = (selectedBall, predictionCorrect, tempoGroundballBonus = 0, handEffect = {}, actualVelocity = 145, batter = null, pitcher = null, defense = null, catcher = null) => {
        const effectiveBatter = batter || { meet: 60, power: 60, eye: 60, speed: 60 };
        const effectiveCatcher = catcher || { lead: 50 };
        const safeCount = count || { balls: 0, strikes: 0 };

        // 前球情報（トンネリング用）
        const lastPitch = pitchLog.length > 0 ? pitchLog[pitchLog.length - 1] : null;
        const currentPitch = {
          type: selectedBall?.type || 'straight',
          velocity: actualVelocity,
          level: selectedBall?.level || 100
        };

        // トンネリング効果を計算
        const tunnelingEffect = getTunnelingEffect(lastPitch, currentPitch, effectiveCatcher.lead);

        // 【新物理モデル】タイミングウィンドウベースのコンタクト計算
        const physicsResult = calculatePhysicsContact(
          pitcher,
          effectiveBatter,
          predictionCorrect,
          currentPitch,
          tunnelingEffect,
          handEffect
        );

        // 空振り判定（物理モデルから）
        if (!physicsResult.isContact) {
          return {
            type: 'swinging_strike',
            description: `空振り（窓${physicsResult.timingWindow.toFixed(1)}ms/誤差${physicsResult.timingError.toFixed(1)}ms）`,
            timingWindow: physicsResult.timingWindow,
            timingError: physicsResult.timingError,
            pitchType: ballEffects[currentPitch.type]?.name || 'ストレート',
            velocity: Math.round(actualVelocity)
          };
        }

        // ===== ファウル判定（大幅強化）=====
        // ミート品質が低いほどファウルになりやすい
        const foulBaseRate = 0.35;  // 基本ファウル率35%
        const qualityPenalty = (1 - physicsResult.meetQuality) * 0.25;  // 芯を外すほど+25%
        let foulRate = foulBaseRate + qualityPenalty;

        // 2ストライク時は粘りやすい（ファウル率上昇）
        if (safeCount.strikes === 2) {
          foulRate += 0.10;
        }

        const pitchTypeName = ballEffects[currentPitch.type]?.name || 'ストレート';
        const roundedVelocity = Math.round(actualVelocity);

        if (Math.random() < foulRate) {
          if (safeCount.strikes === 2) {
            return { type: 'foul_2strike', description: 'ファウル', pitchType: pitchTypeName, velocity: roundedVelocity };
          }
          return { type: 'foul', description: 'ファウル', pitchType: pitchTypeName, velocity: roundedVelocity };
        }

        // 物理演算で打球パラメータを計算
        const battedBall = calculateBattedBallPhysics(effectiveBatter, pitcher, currentPitch, physicsResult);

        // 角度によるファウル判定（強化）
        if (Math.abs(battedBall.direction) > 30 && Math.random() < 0.70) {  // 55%→70%
          if (safeCount.strikes === 2) {
            return { type: 'foul_2strike', description: 'ファウル', pitchType: pitchTypeName, velocity: roundedVelocity };
          }
          return { type: 'foul', description: 'ファウル', pitchType: pitchTypeName, velocity: roundedVelocity };
        }

        // 打球統計を記録
        const battedBallType = battedBall.launchAngle < 10 ? 'grounder' :
                               battedBall.launchAngle < 25 ? 'liner' :
                               battedBall.launchAngle < 50 ? 'fly' : 'popup';

        setBattedBallTypeStats(prev => ({
          ...prev,
          [battedBallType]: prev[battedBallType] + 1
        }));

        // 打球方向を記録
        let ballDirection;
        if (battedBall.direction < -20) ballDirection = 'left';
        else if (battedBall.direction < -5) ballDirection = 'leftCenter';
        else if (battedBall.direction <= 5) ballDirection = 'center';
        else if (battedBall.direction <= 20) ballDirection = 'rightCenter';
        else ballDirection = 'right';

        setBattedBallDirectionStats(prev => ({
          ...prev,
          [ballDirection]: prev[ballDirection] + 1
        }));

        // 時間競合モデルで守備判定
        const fieldingResult = judgeFielderReach(battedBall, defense, effectiveBatter);

        // 結果を変換して返す
        const resultMap = {
          'homerun': { type: 'homerun', description: fieldingResult.description, hit: true },
          'triple': { type: 'triple', description: fieldingResult.description, hit: true },
          'double': { type: 'double', description: fieldingResult.description, hit: true },
          'single': { type: 'single', description: fieldingResult.description, hit: true, isError: fieldingResult.isError },
          'out': {
            type: 'out',
            description: fieldingResult.description,
            hit: false,
            isOutfieldFly: fieldingResult.isOutfieldFly,
            tagupThrowbackChance: fieldingResult.tagupThrowbackChance
          }
        };

        const result = resultMap[fieldingResult.result] || resultMap['out'];

        // 打球データを結果に付加（統計ログ用）
        return {
          ...result,
          exitVelocity: battedBall.exitVelocity,
          launchAngle: battedBall.launchAngle,
          distance: battedBall.distance,
          meetQuality: battedBall.meetQuality,
          v_swing: physicsResult.v_swing,
          timingWindow: physicsResult.timingWindow,
          timingError: physicsResult.timingError
        };
      };

      const simulatePitch = () => {
        // ============================================================
        // 現在の選手データを取得
        // ============================================================
        const currentBatter = getCurrentBatter();
        const currentPitcher = getCurrentPitcher();
        const currentCatcher = getCurrentCatcher();
        
        // 選手データから必要な情報を展開
        const batter = {
          name: currentBatter.name,
          meet: currentBatter.batting.meet,
          power: currentBatter.batting.power,
          eye: currentBatter.batting.eye,
          speed: currentBatter.physical.speed,
          steal: currentBatter.batting.steal,
          bats: currentBatter.batting.bats
        };
        
        const pitcher = {
          name: currentPitcher.name,
          velocity: currentPitcher.pitching.velocity,
          control: currentPitcher.pitching.control,
          stamina: currentPitcher.pitching.stamina,
          throws: currentPitcher.physical.throws,
          pitches: currentPitcher.pitching.arsenal
        };
        
        const catcher = {
          name: currentCatcher.name,
          lead: currentCatcher.catching.lead,
          arm: currentCatcher.physical.arm,
          throws: currentCatcher.physical.throws
        };
        
        // 守備データ（守備チームの選手データから構築）
        const defenseTeam = getDefenseTeam();
        const defense = {};
        defenseTeam.players.forEach(player => {
          defense[player.position] = {
            defense: player.fielding.defense,
            speed: player.physical.speed,
            arm: player.physical.arm,
            throws: player.physical.throws
          };
        });
        
        // スタミナを1減らす
        const newStamina = Math.max(0, currentStamina - 1);
        setCurrentStamina(newStamina);
        
        // スタミナによる能力補正を取得
        const { velocityPenalty, controlPenalty } = getStaminaPenalty(newStamina, pitcher.stamina);
        
        // countのデフォルト値設定
        const safeCount = count || { balls: 0, strikes: 0 };
        const adjustment = getCountAdjustment(safeCount.balls, safeCount.strikes);
        
        // まず球種を選択（全ての球種から選ぶ）
        const totalPitchTypes = pitcher.pitches.length;
        
        // 新しい予測式: 球種が増えるほど予測が外れやすくなる
        // 1球種: 100%, 2球種: 48%, 3球種: 29.3%, 4球種: 19%, 5球種: 14%, 6球種: 8.6%
        let basePredictionRate;
        if (totalPitchTypes === 1) {
          basePredictionRate = 1.00;
        } else {
          // 球種数に応じて予測率を計算
          // リード力による追加削減: 2球種以上で、1球種増えるごとに2%削減
          const leadReduction = (catcher.lead / 100) * 0.02 * (totalPitchTypes - 1);
          
          // 基本予測率テーブル
          const baseRates = {
            2: 0.50,
            3: 0.313,
            4: 0.21,
            5: 0.16,
            6: 0.106
          };
          
          basePredictionRate = baseRates[totalPitchTypes] || (0.106 - (totalPitchTypes - 6) * 0.02);
          basePredictionRate = Math.max(0, basePredictionRate - leadReduction);
        }
        
        const finalPredictionRate = basePredictionRate;
        const predictionCorrect = Math.random() < finalPredictionRate;
        
        // キャッチャーリードで配球を最適化
        let pitchChoice;
        let selectedBall;
        
        if (catcher.lead > 0) {
          const leadInfluence = catcher.lead / 100;
          const ballScores = pitcher.pitches.map((ball, index) => {
            const effect = ballEffects[ball.type];
            const levelFactor = ball.level / 100;
            const score = (effect.whiffBonus + effect.groundballBonus + effect.weakBonus) * levelFactor;
            return { index, score, ball };
          });
          
          if (Math.random() < leadInfluence) {
            ballScores.sort((a, b) => b.score - a.score);
            const topChoices = ballScores.slice(0, Math.max(1, Math.floor(ballScores.length / 2)));
            const chosen = topChoices[Math.floor(Math.random() * topChoices.length)];
            pitchChoice = chosen.index;
          } else {
            pitchChoice = Math.floor(Math.random() * totalPitchTypes);
          }
        } else {
          pitchChoice = Math.floor(Math.random() * totalPitchTypes);
        }
        
        selectedBall = pitcher.pitches[pitchChoice];
        
        // 球種レベルによる制球ペナルティ + スタミナペナルティ
        // ストレートはペナルティなし
        let effectiveControl = pitcher.control + controlPenalty;  // スタミナペナルティ適用
        if (selectedBall && selectedBall.type !== 'straight') {
          const ballControlPenalty = 30 - (selectedBall.level / 100) * 30; // 元の値に戻す
          effectiveControl = Math.max(0, effectiveControl - ballControlPenalty);
        }
        
        // ストライクゾーン確率を実効制球で計算（制球の影響を強化）
        const strikeZoneProb = 0.25 + (effectiveControl / 100) * 0.65; // 基本値を下げ、制球の影響を大きく
        const isInStrikeZone = Math.random() < (strikeZoneProb * adjustment.strikeZone);
        
        const catcherLeadEffect = (catcher.lead / 100) * 0.10;
        
        let swingProb;
        if (isInStrikeZone) {
          // ストライクゾーン: 早打ち傾向にして投球数を減らす
          if (safeCount.strikes === 2) {
            // 2ストライク: 見逃し三振を避けるため振る
            swingProb = 0.90 + ((100 - batter.eye) / 100) * 0.08;
          } else if (safeCount.balls >= 2) {
            // 有利カウント（2ボール以上）: やや慎重に
            swingProb = 0.60 + ((100 - batter.eye) / 100) * 0.30;
          } else {
            // 通常カウント: 早打ち
            swingProb = 0.75 + ((100 - batter.eye) / 100) * 0.20;
          }
          swingProb = swingProb * (1 - catcherLeadEffect);
        } else {
          // ボールゾーン: 選球眼の効果をさらに弱めて出塁率を下げる
          if (safeCount.strikes === 2) {
            // 2ストライク: やや振る
            swingProb = 0.20 + ((100 - batter.eye) / 100) * 0.30;
          } else {
            // 通常: ボールでも振る
            swingProb = 0.15 + ((100 - batter.eye) / 100) * 0.30;
          }
          // ボールゾーンではキャッチャーリード効果なし
        }
        swingProb *= adjustment.swingRate;
        
        const doesSwing = Math.random() < swingProb;
        
        // 球種選択を先に行う（見逃し時も球種情報が必要）
        const pitchTypeName = ballEffects[selectedBall.type].name;
        let baseVelocity = pitcher.velocity + velocityPenalty;
        baseVelocity -= ballEffects[selectedBall.type].velocityMinus;
        const actualVelocity = Math.round(baseVelocity - (Math.random() * 8));
        
        if (!doesSwing) {
          const result = isInStrikeZone 
            ? { type: 'called_strike', description: '見逃しストライク' }
            : { type: 'ball', description: 'ボール' };
          return { ...result, pitchType: pitchTypeName, velocity: actualVelocity };
        }
        
        if (!isInStrikeZone) {
          return { type: 'swinging_strike', description: '空振り（ボール球）', pitchType: pitchTypeName, velocity: actualVelocity };
        }
        
        // 左右の相性効果を取得
        const handEffect = getHandednessEffect(pitcher.throws, batter.bats);
        
        // 【新物理モデル】空振り判定も含めて全てdetermineContactResultPhysicsに委ねる
        // タイミングウィンドウベースの物理判定により、空振りも自然に発生
        const result = determineContactResultPhysics(selectedBall, predictionCorrect, 0, handEffect, actualVelocity, batter, pitcher, defense, catcher);
        return { ...result, pitchType: pitchTypeName, velocity: Math.round(actualVelocity) };
      };

      // 旧determineContactResult（互換性のために残す）
      const determineContactResult = (selectedBall, predictionCorrect, tempoGroundballBonus = 0, handEffect = {}, actualVelocity = 145, batter = null, pitcher = null, defense = null) => {
        // 新エンジンに転送
        return determineContactResultPhysics(selectedBall, predictionCorrect, tempoGroundballBonus, handEffect, actualVelocity, batter, pitcher, defense, null);
      };

      const advanceRunners = (hitType) => {
        const newBases = [false, false, false];
        let runsScored = 0;
        
        if (hitType === 'homerun') {
          runsScored = 1 + bases.filter(b => b).length;
          // setBases([false, false, false]); ← 削除
          return { bases: [false, false, false], runsScored };
        }
        
        const advancement = hitType === 'single' ? 1 : hitType === 'double' ? 2 : 3;
        
        for (let i = 2; i >= 0; i--) {
          if (bases[i]) {
            const newBase = i + advancement;
            if (newBase >= 3) {
              runsScored++;
            } else {
              newBases[newBase] = true;
            }
          }
        }
        
        if (advancement < 3) {
          newBases[advancement - 1] = true;
        } else {
          runsScored++;
        }
        
        // setBases(newBases); ← 削除
        return { bases: newBases, runsScored };
      };

      const throwPitch = () => {
        // ガード: countがundefinedの場合は早期リターン
        if (!count || count.balls === undefined) {
          console.warn('count is not ready');
          return;
        }
        
        // 現在の選手データを取得（チーム対応）
        const currentBatter = getCurrentBatter();
        const currentPitcher = getCurrentPitcher();
        const currentCatcher = getCurrentCatcher();
        const defenseTeam = getDefenseTeam();
        
        // ローカル変数として展開

      // 最終発生率
          const wildPitchRate = baseWildPitchRate * (1 + velocityFactor) * (1 - catcherReduction);

              const prevExtra = extraInningScores.home.reduce((a, b) => a + b, 0);
              const homeInningRuns = newScore.home - prevRegular - prevExtra;
              setExtraInningScores(prev => {
                const newHome = [...prev.home];
                newHome[extraInn] = homeInningRuns;
                return { ...prev, home: newHome };
              });
            }
          }
          
          // 試合終了判定（3アウト時）
          if (inning >= 9 && isTopInning && newScore.home > newScore.away) {
            // 9回表終了時、ホームがリードしていれば試合終了（9回裏不要）
            setGameOver(true);
            setLastResult({ description: `試合終了！ ${homeTeam.name} の勝利！` });
          } else if (inning >= 9 && !isTopInning && newScore.home !== newScore.away) {
            // 9回裏以降で決着（3アウトで終了）
            setGameOver(true);
            setLastResult({ description: `試合終了！ ${newScore.home > newScore.away ? homeTeam.name : awayTeam.name} の勝利！` });
          } else if (inning >= maxExtraInnings && !isTopInning) {
            // 延長最大回数で引き分け
            setGameOver(true);
            setLastResult({ description: `試合終了！ 延長${maxExtraInnings}回 引き分け` });
          } else {
            if (isTopInning) {
              setIsTopInning(false);
            } else {
              setIsTopInning(true);
              setInning(inning + 1);
            }
          }

              return { ...prev, home: newHome };

            });
          }

                      if (pos === 'catcher') return isCurrentBatter ? 'bg-cyan-500 text-white' : 'bg-cyan-600 text-white';  // 🔵 水色
                      if (['first', 'second', 'third', 'short'].includes(pos)) return isCurrentBatter ? 'bg-yellow-400 text-black' : 'bg-yellow-600 text-white';  // 🟡 黄色
                      if (['left', 'center', 'right'].includes(pos)) return isCurrentBatter ? 'bg-green-500 text-white' : 'bg-green-600 text-white';  // 🟢 緑
                      return 'bg-gray-700';
                    };

                    const throwHand = player.physical.throws === 'right' ? '右' : '左';
                    const batHand = player.batting.bats === 'right' ? '右' : player.batting.bats === 'left' ? '左' : '両';

                    const isSelected = !gameStarted && selectedBatterAway === player.battingOrder;

                          {isCurrentBatter && <span>⚾</span>}
                          {isSelected && <span>👆</span>}
                          {isPositionSelected && <span>🔄</span>}

                            fitness.grade === 'B' ? 'text-blue-400' :
                            fitness.grade === 'D' ? 'text-red-400' :
                            'text-gray-400'

                            return (
                              <td key={i} className="py-2 px-1 text-orange-400 font-bold" style={{textShadow: homeScore !== null && homeScore !== undefined || showX ? '0 0 6px #fb923c' : 'none'}}>

                            return (
